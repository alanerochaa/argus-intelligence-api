# ==================================================
# APPLICATION
# ==================================================

spring.application.name=argus-intelligence-api
server.port=${SERVER_PORT:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=10s

spring.devtools.restart.enabled=false

# Serializacao Java -> RabbitMQ -> C#
spring.jackson.serialization.write-dates-as-timestamps=false


# ==================================================
# DATABASE - ORACLE
# ==================================================

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:2}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:0}
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.idle-timeout=10000
spring.datasource.hikari.max-lifetime=30000


# ==================================================
# JPA
# ==================================================

spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.sql.init.mode=never


# ==================================================
# LOGGING
# ==================================================

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.org.springframework.web=INFO
logging.level.org.springframework.amqp=INFO
logging.level.br.com.fiap.argus=DEBUG


# ==================================================
# SWAGGER
# ==================================================

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.show-actuator=true


# ==================================================
# ACTUATOR
# ==================================================

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.info.env.enabled=true
management.health.rabbit.enabled=true


# ==================================================
# INFO
# ==================================================

info.nome=ARGUS Intelligence API
info.status=ATIVO


# ==================================================
# NASA
# ==================================================

nasa.firms.base-url=https://firms.modaps.eosdis.nasa.gov/api
nasa.firms.map-key=${NASA_FIRMS_MAP_KEY}
nasa.firms.source=VIIRS_SNPP_NRT
nasa.firms.area=-85,-57,-32,14
nasa.firms.day-range=1


# ==================================================
# WEATHER
# ==================================================

weather.api.url=${WEATHER_API_URL:https://api.open-meteo.com/v1/forecast}


# ==================================================
# IA
# ==================================================

ia.api.url=${IA_API_URL}


# ==================================================
# C#
# ==================================================

csharp.integration.enabled=${CSHARP_INTEGRATION_ENABLED:true}
csharp.api.url=${CSHARP_API_URL}

csharp.admin.email=${CSHARP_ADMIN_EMAIL}
csharp.admin.senha=${CSHARP_ADMIN_SENHA}


# ==================================================
# FEIGN
# ==================================================

spring.cloud.openfeign.client.config.default.connect-timeout=10000
spring.cloud.openfeign.client.config.default.read-timeout=60000
spring.cloud.openfeign.client.config.default.logger-level=FULL


# ==================================================
# CACHE
# ==================================================

spring.cache.type=simple


# ==================================================
# RABBITMQ
# ==================================================

spring.rabbitmq.host=${SPRING_RABBITMQ_HOST}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD}
spring.rabbitmq.virtual-host=${SPRING_RABBITMQ_VIRTUAL_HOST}
spring.rabbitmq.ssl.enabled=${SPRING_RABBITMQ_SSL_ENABLED}
spring.rabbitmq.listener.simple.auto-startup=true


# ==================================================
# AUTH
# ==================================================

app.admin.email=${APP_ADMIN_EMAIL}
app.admin.senha=${APP_ADMIN_SENHA}

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}


# ==================================================
# SPRING AI
# ==================================================

spring.ai.openai.api-key=${OPENAI_API_KEY:fake-key}
spring.ai.openai.chat.options.model=${OPENAI_MODEL:gpt-4o-mini}
spring.ai.openai.enabled=${SPRING_AI_ENABLED:false}
