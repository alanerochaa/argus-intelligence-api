# ==================================================
# APPLICATION
# ==================================================

spring.application.name=argus-intelligence-api
server.port=${SERVER_PORT:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=10s

# Evita reinicios automaticos abrindo sessoes extras no Oracle
spring.devtools.restart.enabled=false

# Serializacao padrao para integracao Java -> RabbitMQ -> C#
spring.jackson.serialization.write-dates-as-timestamps=false


# ==================================================
# DATABASE - ORACLE FIAP
# ==================================================

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:oracle:thin:@oracle.fiap.com.br:1521/ORCL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:rm561052}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:280798}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Pool reduzido para evitar ORA-02391
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:2}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:0}
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.idle-timeout=10000
spring.datasource.hikari.max-lifetime=30000


# ==================================================
# JPA / HIBERNATE
# ==================================================

spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.sql.init.mode=never


# ==================================================
# LOGGING
# ==================================================

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.org.springframework.web=INFO
logging.level.org.springframework.amqp=INFO
logging.level.br.com.fiap.argus=DEBUG


# ==================================================
# SWAGGER / OPENAPI
# ==================================================

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.show-actuator=true


# ==================================================
# ACTUATOR
# ==================================================

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.info.env.enabled=true
management.health.rabbit.enabled=true


# ==================================================
# INFO - ARGUS
# ==================================================

info.nome=ARGUS Intelligence API
info.descricao=API de monitoramento ambiental e inteligencia territorial
info.projeto=Global Solution 2026-1
info.grupo=CodeGirls
info.integrantes=Alane Rocha da Silva, Anna Beatriz de Araujo Bonfim, Maria Eduarda Araujo Penas
info.tecnologias=Java, Spring Boot, Oracle, RabbitMQ, CloudAMQP, Swagger, NASA FIRMS, Feign, IA, Azure
info.status=ATIVO


# ==================================================
# NASA FIRMS
# ==================================================

nasa.firms.base-url=https://firms.modaps.eosdis.nasa.gov/api
nasa.firms.map-key=${NASA_FIRMS_MAP_KEY:e37c223808f6067a760b3de8d9443d79}
nasa.firms.source=VIIRS_SNPP_NRT
nasa.firms.area=-85,-57,-32,14
nasa.firms.day-range=1


# ==================================================
# WEATHER API
# ==================================================

weather.api.url=${WEATHER_API_URL:https://api.open-meteo.com/v1/forecast}


# ==================================================
# IA API
# ==================================================

ia.api.url=${IA_API_URL:https://argus-ia-spring-eddyerg5dkdqbhba.brazilsouth-01.azurewebsites.net}


# ==================================================
# C# API / OPERATIONS .NET
# ==================================================

csharp.integration.enabled=${CSHARP_INTEGRATION_ENABLED:true}
csharp.api.url=${CSHARP_API_URL:https://argus-operations-rm559561.azurewebsites.net}

# Credenciais usadas pelo Java para autenticar automaticamente na API C#
csharp.admin.email=${CSHARP_ADMIN_EMAIL:admin@argus.com}
csharp.admin.senha=${CSHARP_ADMIN_SENHA:Admin@123}


# ==================================================
# FEIGN
# ==================================================

spring.cloud.openfeign.client.config.default.connect-timeout=10000
spring.cloud.openfeign.client.config.default.read-timeout=60000
spring.cloud.openfeign.client.config.default.logger-level=FULL


# ==================================================
# CACHE
# ==================================================

spring.cache.type=simple


# ==================================================
# RABBITMQ
# LOCAL -> Docker
# AZURE -> CloudAMQP
# ==================================================

spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:argus}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:argus123}
spring.rabbitmq.virtual-host=${SPRING_RABBITMQ_VIRTUAL_HOST:/}
spring.rabbitmq.ssl.enabled=${SPRING_RABBITMQ_SSL_ENABLED:false}
spring.rabbitmq.listener.simple.auto-startup=${SPRING_RABBITMQ_LISTENER_SIMPLE_AUTO_STARTUP:true}


# ==================================================
# AUTH / JWT
# ==================================================

app.admin.email=${APP_ADMIN_EMAIL:admin@argus.com}
app.admin.senha=${APP_ADMIN_SENHA:Admin@123}

jwt.secret=${JWT_SECRET:argus-intelligence-api-global-solution-2026-fiap-jwt-secret}
jwt.expiration=${JWT_EXPIRATION:86400000}


# ==================================================
# SPRING AI
# ==================================================

spring.ai.openai.api-key=${OPENAI_API_KEY:fake-key}
spring.ai.openai.chat.options.model=${OPENAI_MODEL:gpt-4o-mini}
spring.ai.openai.enabled=${SPRING_AI_ENABLED:false}


# ==================================================
# CORS
# ==================================================

argus.cors.allowed-origins=*