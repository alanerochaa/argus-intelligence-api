# ==================================================
# APPLICATION
# ==================================================

spring.application.name=argus-intelligence-api
server.port=${SERVER_PORT:8080}


# ==================================================
# DATABASE - ORACLE FIAP
# ==================================================

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:oracle:thin:@oracle.fiap.com.br:1521/ORCL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:rm561052}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:280798}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver


# ==================================================
# JPA / HIBERNATE
# ==================================================

spring.jpa.hibernate.ddl-auto=none

# NECESS\u00C1RIO PARA AZURE + ORACLE
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect

spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# ==================================================
# SQL INITIALIZATION
# ==================================================

spring.sql.init.mode=never


# ==================================================
# LOGGING
# ==================================================

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE


# ==================================================
# SWAGGER / OPENAPI
# ==================================================

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.show-actuator=true


# ==================================================
# ACTUATOR
# ==================================================

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.info.env.enabled=true


# ==================================================
# INFO - ARGUS
# ==================================================

info.nome=ARGUS Intelligence API
info.descricao=API de monitoramento ambiental e inteligencia territorial
info.projeto=Global Solution 2026-1
info.grupo=CodeGirls
info.integrantes=Alane Rocha da Silva, Anna Beatriz de Araujo Bonfim, Maria Eduarda Araujo Penas
info.tecnologias=Java, Spring Boot, Oracle, RabbitMQ, Swagger, NASA FIRMS, Feign Client, IA Generativa
info.status=ATIVO


# ==================================================
# NASA FIRMS
# ==================================================

nasa.firms.map-key=${NASA_FIRMS_MAP_KEY:e37c223808f6067a760b3de8d9443d79}
nasa.firms.base-url=https://firms.modaps.eosdis.nasa.gov/api
nasa.firms.source=VIIRS_SNPP_NRT
nasa.firms.area=-85,-57,-32,14
nasa.firms.day-range=1


# ==================================================
# WEATHER API
# ==================================================

weather.api.url=${WEATHER_API_URL:https://api.open-meteo.com/v1/forecast}


# ==================================================
# EXTERNAL AI API
# ==================================================

ia.api.url=${IA_API_URL:https://argus-ia-spring-eddyerg5dkdqbhba.brazilsouth-01.azurewebsites.net}


# ==================================================
# C# / .NET API
# TEMPORARIAMENTE DESABILITADA
# ==================================================

csharp.integration.enabled=${CSHARP_INTEGRATION_ENABLED:false}
csharp.api.url=${CSHARP_API_URL:http://localhost:5215}
csharp.api.token=${CSHARP_API_TOKEN:teste}

# ==================================================
# FEIGN
# ==================================================

spring.cloud.openfeign.client.config.default.connect-timeout=10000
spring.cloud.openfeign.client.config.default.read-timeout=60000


# ==================================================
# CACHE
# ==================================================

spring.cache.type=simple


# ==================================================
# RABBITMQ
# LOCAL -> Docker
# AZURE -> CloudAMQP
# ==================================================

spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}

# CloudAMQP TLS = 5671
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5671}

spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:argus}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:argus123}

spring.rabbitmq.virtual-host=${SPRING_RABBITMQ_VIRTUAL_HOST:/}

# importante para CloudAMQP
spring.rabbitmq.ssl.enabled=${SPRING_RABBITMQ_SSL_ENABLED:false}

spring.rabbitmq.listener.simple.auto-startup=${SPRING_RABBITMQ_LISTENER_SIMPLE_AUTO_STARTUP:true}


# ==================================================
# JWT
# ==================================================

jwt.secret=${JWT_SECRET:argus-intelligence-api-global-solution-2026}
jwt.expiration=${JWT_EXPIRATION:86400000}


# ==================================================
# SPRING AI
# ==================================================

spring.ai.azure.openai.enabled=false
spring.ai.azure.openai.endpoint=http://localhost:9999
spring.ai.azure.openai.api-key=fake-key
spring.ai.azure.openai.chat.options.deployment-name=fake-deployment