# ==================================================
# APPLICATION
# ==================================================

spring.application.name=argus-intelligence-api
server.port=${SERVER_PORT:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=10s

spring.devtools.restart.enabled=false


# ==================================================
# DATABASE - ORACLE FIAP
# ==================================================

spring.datasource.url=${SPRING_DATASOURCE_URL:}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:2}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:0}
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.idle-timeout=10000
spring.datasource.hikari.max-lifetime=30000


# ==================================================
# JPA / HIBERNATE
# ==================================================

spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.sql.init.mode=never


# ==================================================
# LOGGING
# ==================================================

logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.orm.jdbc.bind=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.amqp=INFO
logging.level.br.com.fiap.argus=INFO


# ==================================================
# SWAGGER / OPENAPI
# ==================================================

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.show-actuator=true


# ==================================================
# ACTUATOR
# ==================================================

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.info.env.enabled=true
management.health.rabbit.enabled=true


# ==================================================
# INFO - ARGUS
# ==================================================

info.nome=ARGUS Intelligence API
info.descricao=API de monitoramento ambiental e inteligencia territorial
info.projeto=Global Solution 2026-1
info.grupo=CodeGirls
info.integrantes=Alane Rocha da Silva, Anna Beatriz de Araujo Bonfim, Maria Eduarda Araujo Penas
info.tecnologias=Java, Spring Boot, Oracle, RabbitMQ, CloudAMQP, Swagger, NASA FIRMS, Feign, IA, Azure
info.status=ATIVO


# ==================================================
# NASA FIRMS
# ==================================================

nasa.firms.base-url=${NASA_FIRMS_BASE_URL:https://firms.modaps.eosdis.nasa.gov/api}
nasa.firms.map-key=${NASA_FIRMS_MAP_KEY:}
nasa.firms.source=${NASA_FIRMS_SOURCE:VIIRS_SNPP_NRT}
nasa.firms.area=${NASA_FIRMS_AREA:-85,-57,-32,14}
nasa.firms.day-range=${NASA_FIRMS_DAY_RANGE:1}


# ==================================================
# WEATHER API
# ==================================================

weather.api.url=${WEATHER_API_URL:https://api.open-meteo.com/v1/forecast}


# ==================================================
# IA API
# ==================================================

ia.api.url=${IA_API_URL:https://argus-ia-spring-eddyerg5dkdqbhba.brazilsouth-01.azurewebsites.net}


# ==================================================
# C# API / OPERATIONS .NET
# ==================================================

csharp.integration.enabled=${CSHARP_INTEGRATION_ENABLED:false}
csharp.api.url=${CSHARP_API_URL:http://localhost:5215}
csharp.api.token=${CSHARP_API_TOKEN:}


# ==================================================
# FEIGN
# ==================================================

spring.cloud.openfeign.client.config.default.connect-timeout=10000
spring.cloud.openfeign.client.config.default.read-timeout=60000
spring.cloud.openfeign.client.config.default.logger-level=BASIC


# ==================================================
# CACHE
# ==================================================

spring.cache.type=simple


# ==================================================
# RABBITMQ
# LOCAL/AZURE -> configurar via variaveis de ambiente
# ==================================================

spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:}
spring.rabbitmq.virtual-host=${SPRING_RABBITMQ_VIRTUAL_HOST:/}
spring.rabbitmq.ssl.enabled=${SPRING_RABBITMQ_SSL_ENABLED:false}
spring.rabbitmq.listener.simple.auto-startup=${SPRING_RABBITMQ_LISTENER_SIMPLE_AUTO_STARTUP:true}


# ==================================================
# JWT
# ==================================================

jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION:86400000}


# ==================================================
# SPRING AI
# ==================================================

spring.ai.azure.openai.enabled=${SPRING_AI_AZURE_OPENAI_ENABLED:false}
spring.ai.azure.openai.endpoint=${SPRING_AI_AZURE_OPENAI_ENDPOINT:}
spring.ai.azure.openai.api-key=${SPRING_AI_AZURE_OPENAI_API_KEY:}
spring.ai.azure.openai.chat.options.deployment-name=${SPRING_AI_AZURE_OPENAI_DEPLOYMENT_NAME:}